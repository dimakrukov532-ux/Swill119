name: Build APK (p4a)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk
        pip install python-for-android

    - name: Set up Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -o commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
        p4a apk --requirements=flask,requests,telebot --private=./ --package=org.swill --name=SWILL --version=1.0 --bootstrap=flask --port=8443 --arch=arm64-v8a

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: swill-apk
        path: bin/*.apk
