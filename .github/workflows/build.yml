name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk
        pip install python-for-android

    - name: Build APK
      run: |
        p4a apk --requirements=flask,requests,telebot --private=./ --package=org.swill --name=SWILL --version=1.0 --bootstrap=flask --port=8443 --arch=arm64-v8a --android-api=30 --ndk-api=21

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: swill-apk
        path: bin/*.apk
