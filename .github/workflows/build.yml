name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk
        pip install buildozer

    - name: Set up Android SDK and NDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -o commandlinetools-linux-11076708_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true
        mkdir -p tools/bin
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/android-sdk/tools/bin/sdkmanager
        ln -sf $HOME/android-sdk/cmdline-tools/latest/bin/avdmanager $HOME/android-sdk/tools/bin/avdmanager
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
        # Устанавливаем NDK 28c без лишнего mv
        mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform
        rm -rf android-ndk-r28c
        wget https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
        unzip -o android-ndk-r28c-linux.zip

    - name: Build APK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
        export ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r28c
        export ANDROIDAPI=30
        export ANDROIDMINAPI=21
        buildozer android debug deploy run

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: swill-apk
        path: bin/*.apk
